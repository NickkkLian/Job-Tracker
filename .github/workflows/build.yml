name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  page-is-built-from-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # the one pinned build dependency, without writing a lock file into the checkout
      - run: npm install --no-save --no-package-lock esbuild@0.27.7
      # index.html must be exactly what src/ builds to, and every file in vendor/ must match the sha256 in vendor/SOURCE.md
      - run: node build.mjs --check
      # every script the page runs comes from this repository (vendor/ is pinned by the step above): check-scripts.mjs
      # lists the forms of loading one that it looks for; its self-test first shows that each form is caught and that
      # the real page passes
      - name: no script from another host
        run: |
          node check-scripts.mjs --self-test
          node check-scripts.mjs
      # every Claude model id in src/ and the built page is Opus 5.5 or Sonnet 5, and replies are read by block type;
      # the self-test first shows each rule goes red on a sample that breaks it
      - name: allowed models only
        run: node check-models.mjs --self-test
