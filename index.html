  y += 20;
  doc.setFont("Helvetica", "normal");
  doc.setFontSize(9.5);
  doc.text(data.contact || "", PW / 2, y, { align: "center" });
  y += 16;
  for (const sec of data.sections || []) {
    checkPage(24);
    y += 8;
    doc.setFont("Helvetica", "bold");
    doc.setFontSize(10);
    doc.setTextColor("#111");
    doc.text(sec.title || "", ML, y);
    y += 3;
    doc.setLineWidth(0.75);
    doc.setDrawColor("#111");
    doc.line(ML, y, PW - MR, y);
    y += 8;
    if (sec.type === "skills") {
      for (const e of sec.entries || []) {
        checkPage(14);
        doc.setFont("Helvetica", "bold");
        doc.setFontSize(9.5);
        doc.setTextColor("#111");
        doc.text((e.label || "") + ": ", ML, y);
        const labelW = doc.getTextWidth((e.label || "") + ":  ");
        doc.setFont("Helvetica", "normal");
        const lines = doc.splitTextToSize(e.items || "", CW - labelW);
        doc.text(lines[0] || "", ML + labelW, y);
        for (let i = 1; i < lines.length; i++) {
          y += 11;
          checkPage();
          doc.text(lines[i], ML + labelW, y);
        }
        y += 13;
      }
    } else {
      for (const e of sec.entries || []) {
        checkPage(16);
        const orgY = y;
        doc.setFont("Helvetica", "bold");
        doc.setFontSize(10);
        doc.setTextColor("#111");
        const orgLines = doc.splitTextToSize(e.org || "", CONTENT_W - 80);
        doc.text(orgLines[0] || "", CONTENT_X, y);
        doc.setFont("Helvetica", "normal");
        doc.setFontSize(9.5);

        for (let i = 1; i < orgLines.length; i++) {
          y += 11;
          doc.setFont("Helvetica", "bold");
          doc.text(orgLines[i], CONTENT_X, y);
        }
        y += 12;
        if (e.role) {
          checkPage(11);
          doc.setFont("Helvetica", "normal");

          doc.setTextColor("#333");

          });

        }

            y += 11;
          });
        }
        y += 6;
      }
